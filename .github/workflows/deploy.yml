name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build kedua aplikasi
        run: |
          for app in user admin; do
            (cd bimtrack-$app && npm install && npm run build)
          done
          mkdir -p site
          cp -r bimtrack-user/dist site/user
          cp -r bimtrack-admin/dist site/admin
          printf '<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BIMTRACK</title><body style="font-family:system-ui;padding:24px"><h1>BIMTRACK</h1><p><a href="user/">Aplikasi Mahasiswa</a></p><p><a href="admin/">Aplikasi Admin</a></p>' > site/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
