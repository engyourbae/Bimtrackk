name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build kedua aplikasi
        run: |
          for app in user admin; do
            (cd bimtrack-$app && npm install && npm run build)
          done
      - name: Susun situs (landing + user + admin)
        run: |
          mkdir -p site/fonts
          cp -r landing/. site/
          cp shared/tokens.css site/tokens.css
          cp -r bimtrack-user/dist site/user
          cp -r bimtrack-admin/dist site/admin
          # Font landing diambil dari paket fontsource yang sudah terpasang di aplikasi user.
          F=bimtrack-user/node_modules/@fontsource-variable
          cp "$F/fraunces/files/fraunces-latin-wght-normal.woff2" site/fonts/fraunces.woff2 || echo "::warning::font Fraunces tidak ditemukan, memakai font cadangan"
          cp "$F/public-sans/files/public-sans-latin-wght-normal.woff2" site/fonts/public-sans.woff2 || echo "::warning::font Public Sans tidak ditemukan, memakai font cadangan"
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
