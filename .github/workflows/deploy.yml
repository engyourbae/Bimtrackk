name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Periksa konfigurasi Firebase (GitHub Secrets)
        env:
          S1: ${{ secrets.FIREBASE_API_KEY }}
          S2: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          S3: ${{ secrets.FIREBASE_PROJECT_ID }}
          S4: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          S5: ${{ secrets.FIREBASE_APP_ID_USER }}
          S6: ${{ secrets.FIREBASE_APP_ID_ADMIN }}
        run: |
          for n in S1 S2 S3 S4 S5 S6; do
            [ -n "${!n}" ] || { echo "::error::Secret Firebase belum lengkap (lihat README, bagian Konfigurasi). Kosong: $n"; exit 1; }
          done
      - name: Build kedua aplikasi
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          for app in user admin; do
            if [ "$app" = user ]; then export VITE_FIREBASE_APP_ID='${{ secrets.FIREBASE_APP_ID_USER }}'; else export VITE_FIREBASE_APP_ID='${{ secrets.FIREBASE_APP_ID_ADMIN }}'; fi
            (cd bimtrack-$app && npm install && npm run build)
          done
      - name: Susun situs (landing + user + admin)
        run: |
          mkdir -p site/fonts
          cp -r landing/. site/
          cp shared/tokens.css site/tokens.css
          cp -r bimtrack-user/dist site/user
          cp -r bimtrack-admin/dist site/admin
          # Font landing diambil dari paket fontsource yang sudah terpasang di aplikasi user.
          F=bimtrack-user/node_modules/@fontsource-variable
          cp "$F/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2" site/fonts/plus-jakarta-sans.woff2 || echo "::warning::font Plus Jakarta Sans tidak ditemukan, memakai font cadangan"
          cp "$F/manrope/files/manrope-latin-wght-normal.woff2" site/fonts/manrope.woff2 || echo "::warning::font Manrope tidak ditemukan, memakai font cadangan"
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
